<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Nền tảng kết nối gia sư và khóa học EduTutor." />
    <meta name="theme-color" content="#247447" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <script>
      ;(() => {
        let theme
        try {
          theme = localStorage.getItem('tutor-web-theme')
        } catch {}
        if (!['light', 'dark'].includes(theme)) {
          theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
        }
        document.documentElement.dataset.theme = theme
        document.documentElement.style.colorScheme = theme
        document.querySelector('meta[name="theme-color"]').content =
          theme === 'dark' ? '#001f3f' : '#247447'
        document.querySelector('link[rel="icon"]').href =
          theme === 'dark' ? '/favicon-dark.svg' : '/favicon.svg'
      })()
    </script>
    <title>EduTutor</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
